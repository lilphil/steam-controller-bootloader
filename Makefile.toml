[config]
skip_core_tasks = true
# Debug images overflow the 8 KiB boot slot; always build release by default.
default_profile = "production"

[env]
PROFILE_NAME = "release"
COMPILER_FLAGS = "--release"

# Kept so `cargo make --profile development` still gets a linkable image.
[env.development]
PROFILE_NAME = "release"
COMPILER_FLAGS = "--release"

[env.production]
PROFILE_NAME = "release"
COMPILER_FLAGS = "--release"

[tasks.install-llvm-tools-preview]
install_crate = { rustup_component_name = "llvm-tools-preview" }

[tasks.install-lpc-checksum]
install_crate = { crate_name = "lpc_checksum", binary = "lpc_checksum", test_arg = "--help" }

[tasks.install-cargo-binutils]
dependencies = ["install-llvm-tools-preview"]
install_crate = { crate_name = "cargo-binutils", binary = "cargo-objcopy", test_arg = "--help" }

[tasks.bootloader-build]
dependencies = ["install-cargo-binutils"]
description = "Compiles bootloader firmware (release; fits 8 KiB)"
command = "cargo"
args = ["objcopy", "--release", "--bin=steam-controller-bootloader", "--", "-O", "binary", "bootloader-release.bin"]

[tasks.bootloader-patch]
dependencies = ["install-lpc-checksum", "bootloader-build"]
script = [
    '''
    lpc_checksum -p LPC11U37_501 bootloader-release.bin
    # Insert custom version identifier.
    echo BEBAFECA | xxd -r -ps | dd conv=notrunc of=bootloader-release.bin seek=36 bs=1
    '''
]

[tasks.bootloader-clean]
script_runner = "@shell"
script = [
    '''
        rm -f bootloader-debug.bin
        rm -f bootloader-release.bin
    '''
]

[tasks.clean]
dependencies = ["bootloader-clean"]
description = "Clean workspace"
command = "cargo"
args = ["clean"]

[tasks.clippy]
command = "cargo"
args = ["clippy", "--release"]

[tasks.build]
dependencies = ["bootloader-patch"]

[tasks.default]
dependencies = ["build"]
